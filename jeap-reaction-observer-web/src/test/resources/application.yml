spring:
  flyway:
    enabled: true
    clean-disabled: false
  application:
    name: test
  main:
    banner-mode: off
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jeap:
  security:
    oauth2:
      resourceserver:
        # The API requires bearer authentication. The JWKS is never fetched by the tests that do not send a
        # token; the ones that do point it at a server of their own.
        system-name: reactionobserver
        authorization-server:
          issuer: "http://localhost/auth"
          jwk-set-uri: "http://localhost/auth/.well-known/jwks.json"
  reaction:
    observer:
      service:
        kafka:
          reaction-identified-topic: reaction-identified
          reactions-observed-topic: reactions-observed
        statistics-period-in-days: 30
        housekeeping-observed-reactions-batch-size: 1000

logging:
  level:
    ch.admin.bit.jeap.reaction.observer: DEBUG
    org: WARN
    kafka: ERROR
    state.change.logger: WARN
    ch.admin.bit.jeap.messaging.kafka.serde.confluent.config: WARN
    io.confluent.kafka.serializers: WARN
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE

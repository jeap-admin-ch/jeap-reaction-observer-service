spring:
  application:
    name: jeap-reaction-observer-service
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5432/sample-db"
    username: db-user
    password: db-pass
    hikari:
      schema: data
  main:
    banner-mode: off

jeap:
  security:
    oauth2:
      resourceserver:
        # Required as of 11.0.0 - the service refuses to start without an authorization server and a system
        # name. Locally this points at a jEAP OAuth mock server (`jeap-oauth-mock-server`, port 8180 by
        # default); nothing fetches the JWKS until a request actually carries a bearer token, so the local
        # run works with the mock stopped as long as only HTTP Basic is used.
        system-name: jeap
        authorization-server:
          issuer: "http://localhost:8180"
          jwk-set-uri: "http://localhost:8180/.well-known/jwks.json"

  reaction:
    observer:
      service:
        kafka:
          reaction-identified-topic: "reaction-identified"
          reactions-observed-topic: "reactions-observed"

  swagger:
    status: open

  messaging:
    kafka:
      bootstrapServers: "http://localhost:9092"
      schemaRegistryUrl: "http://localhost:7781"
      username: user
      password: user-secret
      securityProtocol: SASL_PLAINTEXT
      system-name: jeap
      error-topic-name: message-processing-failed
  monitor:
    prometheus:
      password: "{noop}secret"

logging.level:
  org.apache.kafka: WARN
  io.confluent.kafka: WARN
  ch.admin.bit.jeap.messaging.kafka.serde.confluent.config: WARN
